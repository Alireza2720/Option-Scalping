name: Deploy to VPS
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/apps/Option-Scalping
            git pull origin main
            npm install
            sudo cp frontend/index.html /var/www/optionhunter/
            sudo chown www-data:www-data /var/www/optionhunter/index.html
            pm2 restart option-scalping